    <meta charset="utf-8" />

      rel="apple-touch-icon"

      href="%PUBLIC_URL%/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"

    />
    <link
      rel="icon"
